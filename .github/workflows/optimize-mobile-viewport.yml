name: Optimize mobile viewport
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-mobile-viewport.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply and review responsive layout
        run: |
          set -eu
          python3 tools/optimize-mobile-viewport.py
          node tests/store-regression.mjs
          node tests/ui-ux-regression.mjs
          node tests/shop-ux.mjs
          node tests/wardrobe-scroll-outfits.mjs
          node tests/boutique-regression.mjs
          node tests/home-screen-regression.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('/* Mobile viewport: use available screen space without covering controls. */')==1
          assert '#overlay:not(.storepage):not(.gameover) #startBtn{margin-top:auto' in s
          assert '#overlay.clothespage .clothes-scroll-rail{right:3px;top:var(--wardrobe-rail-top,45%)' in s
          assert '#overlay.clothespage .store-item button{min-height:44px}' in s
          assert 'function syncClothesRailOffset()' in s
          print('PASS viewport layout assertions, hanger alignment, tap target')
          PY
          git diff --check
      - name: Push verified index directly to main
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: use full mobile viewport for grandma home and boutique shop'
          git pull --rebase origin main
          git push origin HEAD:main
