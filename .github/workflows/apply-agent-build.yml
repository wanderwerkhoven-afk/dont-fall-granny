name: Apply Agent Team Build
on:
  push:
    branches: [build/agent-team-hanger-qa]
    paths:
      - 'tools/apply-hanger-fixes.mjs'
      - '.github/workflows/apply-agent-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate patch script syntax
        run: node --check tools/apply-hanger-fixes.mjs
      - name: Apply narrowly scoped changes
        run: node tools/apply-hanger-fixes.mjs
      - name: Verify asset and code references
        run: |
          test -s assets/hanger-spritesheet.png
          grep -q 'refreshHangerAnimation' index.html
          grep -q 'touch-action:pan-y' index.html
          grep -q 'previousScroll' index.html
      - name: Commit patched V11 to build branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'fix: apply Agent Team hanger animation and store scroll improvements' && git push)
