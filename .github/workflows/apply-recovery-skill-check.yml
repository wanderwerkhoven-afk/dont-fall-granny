name: Apply recovery skill check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-recovery-skill-check.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Integrate skill check and run game regressions
        run: |
          set -eu
          python3 tools/apply-recovery-skill-check.py
          node tests/recovery-skill-check.mjs
          node tests/store-regression.mjs
          node tests/ui-ux-regression.mjs
          node tests/shop-ux.mjs
          node tests/wardrobe-scroll-outfits.mjs
          node tests/boutique-regression.mjs
          node tests/home-screen-regression.mjs
          git diff --check
      - name: Push verified recovery gameplay to main
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/recovery-skill-check.mjs
          git commit -m 'gameplay: add precise 0.9s curved recovery skill check and rescue fallthrough'
          git pull --rebase origin main
          git push origin HEAD:main
