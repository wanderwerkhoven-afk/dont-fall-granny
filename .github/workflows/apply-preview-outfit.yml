name: Build and verify Granny outfit preview
on:
  push:
    branches: [fix/hanger-sprite-verified-asset]
    paths:
      - 'tools/preview-outfit-fix.mjs'
      - '.github/workflows/apply-preview-outfit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/preview-outfit-fix.mjs
      - run: node tools/preview-outfit-fix.mjs
      - name: Validate preview and page syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const html=readFileSync('index.html','utf8');
          assert.match(html,/data-preview-coat="true"/);
          assert.equal((html.match(/data-preview-hair="true"/g)||[]).length,3);
          assert.match(html,/function showMenu\(page='home'\)\{\s*updateGrandmaOutfitPreview\(\)/);
          assert.match(html,/hero\.setAttribute\('aria-label','Oma draagt: '\+outfit\.name\)/);
          assert.match(html,/selectedClothes=item\.id/);
          console.log('PASS: preview follows selected outfit, coat and hair tagged; purchase flow preserved');
          NODE
      - name: Commit verified preview change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'fix: synchronize preview granny shirt with selected outfit' && git push)
