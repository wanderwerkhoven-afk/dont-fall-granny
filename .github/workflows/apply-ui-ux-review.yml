name: Apply UI UX review on main
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ui-ux-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted UI UX patch
        run: |
          node --check tools/apply-ui-ux-review.mjs
          node tools/apply-ui-ux-review.mjs
          node tests/store-regression.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const html=readFileSync('index.html','utf8');
          assert.match(html,/Agent UI\/UX review 2026-09-22/);
          assert.match(html,/tabindex="0" aria-label="Spelmenu en winkel/);
          assert.match(html,/b\.setAttribute\('aria-pressed',String\(active\)\)/);
          assert.match(html,/updated\.focus\(\{preventScroll:true\}\)/);
          console.log('PASS UI/UX accessibility, preserved V11 syntax and shop regression');
          NODE
      - name: Commit UI UX changes directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'ui: improve wardrobe alignment, focus and navigation' && git push origin HEAD:main)
