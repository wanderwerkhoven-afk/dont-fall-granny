name: Deploy exact V11

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: exact-v11-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact repository
        uses: actions/checkout@v6

      - name: Prepare exact V11 artifact
        run: |
          mkdir _site
          cp index.html _site/index.html

      - name: Upload exact V11
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy exact V11
        id: deployment
        uses: actions/deploy-pages@v4
