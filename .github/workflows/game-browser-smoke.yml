name: Browser smoke test — start game
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'storybook-worlds.js'
      - 'granny-expressions.js'
      - 'run-results.js'
      - 'game-state.js'
      - 'tests/post-run-browser.cjs'
      - 'levels.js'
      - 'tests/game-smoke.cjs'
      - '.github/workflows/game-browser-smoke.yml'
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/granny-http.log 2>&1 &
          sleep 2
          node tests/game-smoke.cjs
          node tests/post-run-browser.cjs
