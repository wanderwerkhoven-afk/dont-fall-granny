name: Resize shop hanger on main
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resize-hanger-on-main.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Resize hanger and verify game
        run: |
          set -eu
          python3 tools/resize-hanger.py
          node tests/store-regression.mjs
          node tests/ui-ux-regression.mjs
          node tests/shop-ux.mjs
          git diff --check
      - name: Commit verified change to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/store-regression.mjs
          git diff --cached --quiet || (git commit -m 'ui: shrink shop hanger without changing animation' && git pull --rebase origin main && git push origin HEAD:main)
