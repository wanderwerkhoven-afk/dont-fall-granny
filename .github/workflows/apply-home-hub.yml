name: Apply centered home hub
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-home-hub.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply home hub and run regressions
        run: |
          set -eu
          python3 tools/build-home-hub.py
          node tests/store-regression.mjs
          node tests/ui-ux-regression.mjs
          node tests/shop-ux.mjs
          node tests/wardrobe-scroll-outfits.mjs
          node tests/boutique-regression.mjs
          node tests/home-screen-regression.mjs
          git diff --check
      - name: Commit tested home hub to main
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: center grandma and add square outfits gadgets home tiles with achievement'
          git pull --rebase origin main
          git push origin HEAD:main
