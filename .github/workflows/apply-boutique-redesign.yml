name: Apply boutique redesign
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-boutique-redesign.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply targeted redesign and test
        run: |
          set -eu
          python3 tools/apply-boutique-redesign.py
          node tests/store-regression.mjs
          node tests/ui-ux-regression.mjs
          node tests/shop-ux.mjs
          node tests/wardrobe-scroll-outfits.mjs
          node - <<'JS'
          const fs=require('fs'),assert=require('assert');
          const s=fs.readFileSync('index.html','utf8');
          assert.match(s,/#overlay\.clothespage \.store-grid\{grid-template-columns:minmax\(0,1fr\)/);
          assert.match(s,/function hangerFrameSize\(\)\{return window\.matchMedia\('\(max-width:650px\)'\)\.matches\?44:72\}/);
          assert.match(s,/function outfitPatternSvg\(/);
          assert.match(s,/function drawOutfitPattern\(/);
          assert.match(s,/drawOutfitPattern\(outfit,x,y,bob\)/);
          assert.match(s,/patternTarget\.innerHTML=outfitPatternSvg/);
          const block=s.match(/const clothing=\[([\s\S]*?)\];/)[1];
          const costs=[...block.matchAll(/cost:(\d+)/g)].map(m=>Number(m[1]));
          assert.equal(costs.length,12);
          assert.equal(costs[0],0);
          assert.ok(costs.slice(1).every(c=>c>=250));
          assert.equal((block.match(/pattern:'/g)||[]).length,11);
          const script=s.match(/<script>\s*([\s\S]*?)\s*<\/script>/)[1];
          new Function(script);
          console.log('PASS: mobile single-column, price floor, three pattern renderers, syntax');
          JS
          git diff --check
      - name: Push verified boutique changes to main
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'ui: boutique mobile wardrobe, premium outfit prices and patterns'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
