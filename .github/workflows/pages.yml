name: V8 Native Web + GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v8-native-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate native V8 web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify expected files
        run: |
          test -f web/index.html
          test -f web/styles.css
          test -f web/game.js

      - name: Syntax-check JavaScript
        run: node --check web/game.js

      - name: Verify split references
        run: |
          grep -q './styles.css' web/index.html
          grep -q './game.js' web/index.html

      - name: Upload native web artifact
        uses: actions/upload-artifact@v4
        with:
          name: dont-fall-granny-v8-native
          path: web
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
