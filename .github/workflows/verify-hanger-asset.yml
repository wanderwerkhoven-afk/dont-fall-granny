name: Fix and verify hanger sprite
on:
  push:
    branches: [fix/hanger-sprite-verified-asset]
    paths:
      - 'tools/fix-hanger-asset.mjs'
      - '.github/workflows/verify-hanger-asset.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/fix-hanger-asset.mjs
      - run: node tools/fix-hanger-asset.mjs
      - name: Verify resulting HTML references only the new sprite
        run: |
          grep -q "hanger-spritesheet.svg" index.html
          ! grep -q "hanger-spritesheet.png" index.html
      - name: Commit the validated asset wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'fix: load verified vector hanger spritesheet in shop' && git push)
