name: Deploy game with assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site including sprite assets
        run: |
          set -eu
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp -R assets/. _site/assets/
          test -s _site/assets/hanger-spritesheet.png
          test -s _site/index.html
          grep -q 'assets/hanger-spritesheet.png' _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
