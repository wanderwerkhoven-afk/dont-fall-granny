name: Deploy game with assets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sprites, shops, recovery timing, accessibility and game syntax
        run: |
          set -eu
          test -s index.html
          test -s assets/hanger-spritesheet.svg
          node tests/store-regression.mjs
          node tests/ui-ux-regression.mjs
          node tests/shop-ux.mjs
          node tests/wardrobe-scroll-outfits.mjs
          node tests/boutique-regression.mjs
          node tests/home-screen-regression.mjs
          node tests/home-desktop-layout.mjs
          node tests/recovery-skill-check.mjs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site including sprite assets
        run: |
          set -eu
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp -R assets/. _site/assets/
          test -s _site/assets/hanger-spritesheet.svg
          test -s _site/index.html
          grep -q 'assets/hanger-spritesheet.svg' _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
