name: Deploy game with assets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sprites, shops, recovery timing, accessibility and game syntax
        run: |
          set -eu
          test -s index.html
          test -s style.css
          test -s app.js
          test -s granny-expressions.js
          test -s game-meta.js
          test -s progression.js
          test -s levels.js
          test -s storybook-worlds.js
          test -s sw.js
          test -s assets/hanger-spritesheet.svg
          node tests/structure-regression.mjs
          node tests/progression-regression.mjs
          node tests/store-regression.mjs
          node tests/ui-ux-regression.mjs
          node tests/shop-ux.mjs
          node tests/wardrobe-scroll-outfits.mjs
          node tests/boutique-regression.mjs
          node tests/home-screen-regression.mjs
          node tests/home-desktop-layout.mjs
          node tests/recovery-skill-check.mjs
          node tests/recovery-risk-loop.mjs
          node tests/storybook-worlds-regression.mjs
          node tests/granny-expressions-regression.mjs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site including sprite assets
        run: |
          set -eu
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp style.css app.js game-meta.js progression.js levels.js storybook-worlds.js granny-expressions.js sw.js _site/
          cp -R assets/. _site/assets/
          test -s _site/assets/hanger-spritesheet.svg
          test -s _site/index.html
          test -s _site/style.css
          test -s _site/app.js
          test -s _site/granny-expressions.js
          test -s _site/game-meta.js
          test -s _site/progression.js
          test -s _site/levels.js
          test -s _site/storybook-worlds.js
          test -s _site/sw.js
          grep -Eq 'href="style[.]css([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="game-meta[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="progression[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="app[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="granny-expressions[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="levels[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="storybook-worlds[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -q 'assets/hanger-spritesheet.svg' _site/style.css
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
