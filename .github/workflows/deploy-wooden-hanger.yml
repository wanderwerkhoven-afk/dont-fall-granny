name: Deploy game with assets

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify hanger source and HTML reference
        run: |
          set -eu
          test -s index.html
          test -s assets/hanger-spritesheet.svg
          grep -q "assets/hanger-spritesheet.svg" index.html
          if grep -q "assets/hanger-spritesheet.png" index.html; then exit 1; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const svg = fs.readFileSync('assets/hanger-spritesheet.svg', 'utf8');
          assert.match(svg, /width="720" height="120"/);
          assert.equal((svg.match(/<use href="#hanger"/g) || []).length, 6);
          console.log('Six SVG frames and asset reference verified');
          NODE

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site including sprite assets
        run: |
          set -eu
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp -R assets/. _site/assets/
          test -s _site/assets/hanger-spritesheet.svg
          test -s _site/index.html
          grep -q 'assets/hanger-spritesheet.svg' _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
