name: Deploy game with assets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sprites, shops, recovery timing, accessibility and game syntax
        run: |
          set -eu
          test -s index.html
          test -s style.css
          test -s app.js
          test -s replay-engine.js
          test -s daily-challenge.js
          test -s danger-soundscape.js
          test -s world-mastery.js
          test -s world-events.js
          test -s game-state.js
          test -s run-results.js
          test -s granny-expressions.js
          test -s game-meta.js
          test -s progression.js
          test -s levels.js
          test -s storybook-worlds.js
          test -s sw.js
          test -s assets/hanger-spritesheet.svg
          node tests/structure-regression.mjs
          node tests/progression-regression.mjs
          node tests/store-regression.mjs
          node tests/ui-ux-regression.mjs
          node tests/shop-ux.mjs
          node tests/wardrobe-scroll-outfits.mjs
          node tests/boutique-regression.mjs
          node tests/home-screen-regression.mjs
          node tests/home-desktop-layout.mjs
          node tests/recovery-skill-check.mjs
          node tests/recovery-risk-loop.mjs
          node tests/storybook-worlds-regression.mjs
          node tests/granny-expressions-regression.mjs
          node tests/run-result-regression.mjs
          node tests/world-events-regression.mjs
          node tests/world-expansion-phase1-regression.mjs
          node tests/world-expansion-phase2-regression.mjs
          node tests/world-mastery-regression.mjs
          node tests/mastery-shop-unlocks-regression.mjs
          node tests/shop-economy-balance-regression.mjs
          node tests/hat-store-regression.mjs
          node tests/danger-soundscape-regression.mjs
          node tests/daily-challenge-regression.mjs
          node tests/replay-regression.mjs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site including sprite assets
        run: |
          set -eu
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp style.css app.js game-meta.js progression.js levels.js storybook-worlds.js granny-expressions.js game-state.js run-results.js world-events.js world-mastery.js danger-soundscape.js daily-challenge.js replay-engine.js sw.js _site/
          cp -R assets/. _site/assets/
          test -s _site/assets/hanger-spritesheet.svg
          test -s _site/index.html
          test -s _site/style.css
          test -s _site/app.js
          test -s _site/game-state.js
          test -s _site/replay-engine.js
          test -s _site/daily-challenge.js
          test -s _site/danger-soundscape.js
          test -s _site/world-mastery.js
          test -s _site/world-events.js
          test -s _site/run-results.js
          test -s _site/granny-expressions.js
          test -s _site/game-meta.js
          test -s _site/progression.js
          test -s _site/levels.js
          test -s _site/storybook-worlds.js
          test -s _site/sw.js
          grep -Eq 'href="style[.]css([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="game-meta[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="progression[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="app[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="granny-expressions[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="game-state[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="run-results[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="world-events[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="world-mastery[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="danger-soundscape[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="daily-challenge[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="replay-engine[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="levels[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -Eq 'src="storybook-worlds[.]js([?]v=[0-9]+)?"' _site/index.html
          grep -q 'assets/hanger-spritesheet.svg' _site/style.css
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      # GitHub's artifact API can lag immediately after upload; allow indexing.
      - name: Allow Pages artifact to become available
        run: sleep 12
      - id: deployment
        uses: actions/deploy-pages@v4
