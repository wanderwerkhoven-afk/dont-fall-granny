name: Apply simplified home screen
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-simplified-home.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Simplify home and validate game
        run: |
          set -eu
          python3 tools/simplify-home-screen.py
          node tests/store-regression.mjs
          node tests/ui-ux-regression.mjs
          node tests/shop-ux.mjs
          node tests/wardrobe-scroll-outfits.mjs
          node tests/boutique-regression.mjs
          node tests/home-screen-regression.mjs
          git diff --check
      - name: Commit validated home directly to main
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/home-screen-regression.mjs
          git commit -m 'ui: keep grandma hero and primary start, remove redundant home explanations'
          git pull --rebase origin main
          git push origin HEAD:main
