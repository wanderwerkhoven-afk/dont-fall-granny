name: Apply wardrobe scroll and outfits
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wardrobe-scroll-outfits.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply targeted wardrobe change and test
        run: |
          set -eu
          python3 tools/patch-wardrobe-scroll-outfits.py
          node tests/store-regression.mjs
          node tests/ui-ux-regression.mjs
          node tests/shop-ux.mjs
          node tests/wardrobe-scroll-outfits.mjs
          git diff --check
      - name: Commit changes directly to main
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/wardrobe-scroll-outfits.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'ui: unify wardrobe scroll, enable draggable hanger and add six outfits'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
